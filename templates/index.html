<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HASIBGPT – সর্বভাষী AI</title>
<style>
  :root{
    --cream:#F4F1EA;
    --cream-2:#EAE6DC;
    --sidebar:#EFEBE1;
    --ink:#2B2925;
    --ink-soft:#6B6558;
    --clay:#D97757;
    --clay-dark:#C05F3F;
    --line:#DDD6C8;
    --white:#FFFFFF;
    --danger:#B4483A;
  }
  body[data-theme="dark"]{
    --cream:#211F1B;
    --cream-2:#2B2925;
    --sidebar:#1A1815;
    --ink:#F0EBE0;
    --ink-soft:#A69E8C;
    --line:#3A362E;
    --white:#2B2925;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    width:100%;height:100%;
    background:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
    overflow:hidden;
    transition:background 0.2s, color 0.2s;
  }
  #app{
    display:flex;
    height:100vh;
    width:100vw;
    overflow:hidden;
  }

  /* SIDEBAR – সংকুচিত */
  #sidebar{
    width:260px;
    flex-shrink:0;
    background:var(--sidebar);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    transition:margin-left 0.25s ease;
    position:relative;
    z-index:15;
    height:100%;
  }
  #sidebar.collapsed{ margin-left:-260px; }
  #edgeHandle{
    position:fixed;
    top:50%;
    left:0;
    transform:translateY(-50%);
    width:18px;
    height:64px;
    background:var(--clay);
    border-radius:0 10px 10px 0;
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:16;
    box-shadow:2px 0 8px rgba(0,0,0,0.12);
    color:white;
  }
  #edgeHandle.show{ display:flex; }
  #edgeHandle svg{ pointer-events:none; }
  .sidebar-top{
    padding:16px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    margin-bottom:14px;
  }
  .brand .mark{
    width:32px;height:32px;border-radius:9px;
    background:var(--clay);
    display:flex;align-items:center;justify-content:center;
    color:white;font-weight:800;font-size:15px;
  }
  .brand h1{ font-size:16px; margin:0; font-weight:700; }
  #newChatBtn{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid var(--clay);
    background:var(--white);
    color:var(--clay-dark);
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    display:flex;align-items:center;gap:8px;
    justify-content:center;
    transition:background 0.15s;
  }
  #newChatBtn:hover{ background:#fff5f0; }

  #chatList{
    flex:1;
    overflow-y:auto;
    padding:10px;
  }
  .chat-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 10px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:2px;
    gap:6px;
  }
  .chat-item .title{
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    flex:1;
  }
  .chat-item:hover{ background:var(--cream-2); }
  .chat-item.active{
    background:var(--white);
    color:var(--ink);
    font-weight:600;
    box-shadow:0 0 0 1px var(--line);
  }
  .chat-item .del{
    opacity:0;
    color:var(--ink-soft);
    font-size:13px;
    padding:2px 5px;
    border-radius:5px;
    flex-shrink:0;
  }
  .chat-item:hover .del{ opacity:1; }
  .chat-item .del:hover{ background:#f0ddd8; color:var(--danger); }

  .sidebar-foot{
    padding:12px 16px;
    border-top:1px solid var(--line);
    font-size:11px;
    color:var(--ink-soft);
    line-height:1.4;
    flex-shrink:0;
  }

  /* MAIN – বাকি জায়গা পূর্ণ করবে */
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    height:100%;
  }
  header{
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }
  #toggleSidebar{
    width:32px;height:32px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--white);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);
    flex-shrink:0;
  }
  #toggleSidebar:hover{ background:var(--cream-2); }
  header .title-block h2{
    font-family:Georgia,serif;
    font-size:16.5px;
    margin:0;
    font-weight:700;
  }
  header .title-block p{
    margin:1px 0 0;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .header-actions{
    margin-left:auto;
    display:flex;
    gap:6px;
  }
  .header-actions button{
    width:32px;height:32px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--white);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);
  }
  .header-actions button:hover{ background:var(--cream-2); color:var(--ink); }

  #messages{
    flex:1;
    overflow-y:auto;
    padding:24px 24px 8px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--ink-soft);
    max-width:340px;
  }
  .empty-state .mark{
    width:46px;height:46px;border-radius:12px;
    background:var(--clay);
    margin:0 auto 14px;
    display:flex;align-items:center;justify-content:center;
    color:white;font-weight:800;font-size:19px;
  }
  .empty-state h2{
    font-family:Georgia,serif;
    font-size:19px;color:var(--ink);
    margin:0 0 6px;
  }
  .empty-state p{font-size:13.5px;line-height:1.5;margin:0;}

  .row{ display:flex; gap:12px; max-width:100%; }
  .row.user{ justify-content:flex-end; }
  .avatar{
    width:28px;height:28px;border-radius:8px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:800;
    color:white;
    margin-top:2px;
  }
  .avatar.ai{ background:var(--clay); }
  .avatar.me{ background:var(--ink); }

  .bubble-col{ display:flex; flex-direction:column; gap:6px; max-width:78%; }
  .bubble{
    font-size:15px;
    line-height:1.55;
    padding:11px 15px;
    border-radius:14px;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .row.ai .bubble{
    background:var(--white);
    border:1px solid var(--line);
    border-top-left-radius:4px;
  }
  .row.user .bubble{
    background:var(--ink);
    color:var(--cream);
    border-top-right-radius:4px;
  }
  .code-block{
    background:#1E1D1A;
    border-radius:10px;
    overflow:hidden;
    margin:6px 0;
    border:1px solid #33312B;
  }
  .code-block-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 12px;
    background:#26241F;
    border-bottom:1px solid #33312B;
  }
  .code-block-header .lang{
    font-size:11px;
    color:#B8B2A2;
    font-family:'SFMono-Regular',Consolas,monospace;
    text-transform:lowercase;
  }
  .code-block-header button{
    background:none;
    border:none;
    color:#B8B2A2;
    font-size:11.5px;
    cursor:pointer;
    display:flex;align-items:center;gap:4px;
    padding:2px 6px;
    border-radius:5px;
  }
  .code-block-header button:hover{ background:#33312B; color:#EFEBE0; }
  .code-block pre{
    margin:0;
    padding:12px 14px;
    overflow-x:auto;
  }
  .code-block code{
    font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;
    font-size:12.8px;
    line-height:1.55;
    color:#E8E4D8;
    white-space:pre;
  }
  .text-segment{ white-space:pre-wrap; }
  .attached-thumb{
    max-width:220px;
    border-radius:10px;
    border:1px solid var(--line);
    display:block;
  }
  .svg-frame{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px;
    max-width:320px;
  }
  .svg-frame svg{ width:100%; height:auto; display:block; }
  .gen-image-frame{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px;
    max-width:320px;
  }
  .gen-image-frame img{
    width:100%;
    border-radius:8px;
    display:block;
  }
  .gen-image-frame .caption{
    font-size:11.5px;
    color:var(--ink-soft);
    padding:6px 2px 2px;
  }
  .gen-image-frame .download-row{
    display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;
  }
  .gen-image-frame .download-row button{
    background:var(--cream-2);
    border:1px solid var(--line);
    border-radius:20px;
    padding:4px 12px;
    font-size:12px;
    cursor:pointer;
    color:var(--ink);
    display:flex;align-items:center;gap:4px;
    transition:0.15s;
  }
  .gen-image-frame .download-row button:hover{
    background:var(--clay);
    color:white;
    border-color:var(--clay);
  }
  .gen-loading{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:260px;
    height:200px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--ink-soft);
    font-size:12.5px;
  }
  .spinner{
    width:26px;height:26px;
    border-radius:50%;
    border:3px solid var(--line);
    border-top-color:var(--clay);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .msg-actions{
    display:flex; gap:8px; padding-left:2px;
  }
  .msg-actions button{
    background:none;border:none;cursor:pointer;
    color:var(--ink-soft);
    font-size:12px;
    display:flex;align-items:center;gap:4px;
    padding:2px 4px;
    border-radius:6px;
  }
  .msg-actions button:hover{ background:var(--cream-2); color:var(--ink); }

  .typing{ display:flex;gap:4px;align-items:center;padding:6px 2px; }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--ink-soft);
    animation:bounce 1.2s infinite;
  }
  .typing span:nth-child(2){animation-delay:0.15s;}
  .typing span:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{
    0%,60%,100%{transform:translateY(0);opacity:0.5;}
    30%{transform:translateY(-4px);opacity:1;}
  }

  #inputbar{
    padding:12px 18px 18px;
    border-top:1px solid var(--line);
    background:var(--cream);
    flex-shrink:0;
  }
  #attachPreview{
    display:none;
    align-items:center;
    gap:10px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 10px;
    margin-bottom:8px;
    font-size:12.5px;
    color:var(--ink-soft);
    max-width:280px;
  }
  #attachPreview img{
    width:36px;height:36px;object-fit:cover;border-radius:6px;
  }
  #attachPreview .remove{
    margin-left:auto;cursor:pointer;color:var(--danger);
    font-weight:700; padding:0 4px;
  }
  .file-chip{
    display:flex;align-items:center;gap:8px;
    background:var(--cream-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 12px;
    font-size:13px;
    max-width:220px;
  }
  .file-chip-icon{ font-size:16px; }

  #modeRow{
    display:flex; gap:8px; margin-bottom:8px;
  }
  .mode-btn{
    display:flex; align-items:center; gap:6px;
    padding:6px 11px;
    border-radius:20px;
    border:1.5px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
  }
  .mode-btn.active{
    border-color:var(--clay);
    background:#fff1ea;
    color:var(--clay-dark);
  }
  .mode-btn:hover{ border-color:var(--clay); }

  .input-wrap{
    display:flex;
    align-items:flex-end;
    gap:8px;
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:18px;
    padding:8px 8px 8px 12px;
    transition:border-color 0.15s ease;
  }
  .input-wrap:focus-within{ border-color:var(--clay); }
  .icon-btn{
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .icon-btn:hover{ background:var(--cream-2); color:var(--ink); }
  .icon-btn.recording{
    background:var(--danger);
    color:white;
    animation:pulse 1s infinite;
  }
  #emojiBtn{ font-size:17px; }
  #emojiPicker{
    display:none;
    position:absolute;
    bottom:52px;
    left:8px;
    width:260px;
    max-height:220px;
    overflow-y:auto;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,0.14);
    padding:8px;
    grid-template-columns:repeat(7, 1fr);
    gap:2px;
    z-index:30;
  }
  #emojiPicker.show{ display:grid; }
  #emojiPicker button{
    background:none;
    border:none;
    font-size:19px;
    padding:5px;
    border-radius:6px;
    cursor:pointer;
    line-height:1;
  }
  #emojiPicker button:hover{ background:var(--cream-2); }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(180,72,58,0.4); }
    50%{ box-shadow:0 0 0 6px rgba(180,72,58,0); }
  }
  #textInput{
    flex:1;
    border:none;
    outline:none;
    resize:none;
    background:transparent;
    font-size:15px;
    line-height:1.4;
    color:var(--ink);
    max-height:140px;
    padding:6px 0;
    font-family:inherit;
  }
  #textInput::placeholder{ color:#A39C8C; }
  #sendBtn{
    width:36px;height:36px;
    border-radius:50%;
    border:none;
    background:var(--clay);
    color:white;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    transition:background 0.15s ease, transform 0.1s ease;
  }
  #sendBtn:hover{ background:var(--clay-dark); }
  #sendBtn:active{ transform:scale(0.92); }
  #sendBtn:disabled{ background:#CFC8B8; cursor:not-allowed; }
  #sendBtn.stop-mode{ background:var(--danger); }
  #sendBtn.stop-mode:hover{ background:#96392e; }
  .footnote{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:8px;
  }
  #fileInput{ display:none; }

  #messages::-webkit-scrollbar, #chatList::-webkit-scrollbar{ width:8px; }
  #messages::-webkit-scrollbar-thumb, #chatList::-webkit-scrollbar-thumb{
    background:var(--line); border-radius:4px;
  }

  @media (max-width:720px){
    #sidebar{ position:fixed; z-index:20; height:100%; }
    #sidebar.collapsed{ margin-left:-260px; }
    #messages{ padding:16px 12px 8px; }
    .bubble-col{ max-width:90%; }
    header .title-block p{ display:none; }
  }
  @media (min-width:721px){
    /* ডেস্কটপে সাইডবার সবসময় দৃশ্যমান */
    #sidebar.collapsed{ margin-left:0; }
    #edgeHandle{ display:none !important; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="edgeHandle" title="সাইডবার খোলো">
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="9 18 15 12 9 6"/></svg>
  </div>
  <div id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <div class="mark">H</div>
        <h1>HASIBGPT</h1>
      </div>
      <button id="newChatBtn">+ নতুন চ্যাট</button>
    </div>
    <div id="chatList"></div>
    <div class="sidebar-foot">যেকোনো ভাষায় কথা বলো। চ্যাট সংরক্ষিত থাকে (রিফ্রেশে মুছে যায়)।</div>
  </div>

  <div id="main">
    <header>
      <button id="toggleSidebar" title="সাইডবার দেখাও/লুকাও">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>
      <div class="title-block">
        <h2>HASIBGPT – সর্বভাষী</h2>
        <p>যেকোনো ভাষায় প্রশ্ন, ছবি, ভয়েস, ফাইল</p>
      </div>
      <div class="header-actions">
        <button id="downloadBtn" title="চ্যাট ডাউনলোড">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button id="clearBtn" title="এই চ্যাট মুছে ফেলো">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
        <button id="themeBtn" title="ডার্ক/লাইট">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>

    <div id="messages"></div>

    <div id="inputbar">
      <div id="attachPreview">
        <img id="attachThumb" src="" alt="">
        <span id="attachName"></span>
        <span class="remove" id="removeAttach">✕</span>
      </div>

      <div id="modeRow">
        <button class="mode-btn" id="imageGenToggle">🎨 ছবি বানাও</button>
        <button class="mode-btn" id="svgGenToggle">📐 SVG বানাও</button>
      </div>

      <div class="input-wrap" style="position:relative;">
        <button class="icon-btn" id="attachBtn" title="ছবি বা ফাইল">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a1.5 1.5 0 0 1-2.12-2.12l8.49-8.48"/></svg>
        </button>
        <input type="file" id="fileInput" accept="image/*,.pdf,.txt,.md,.csv,.json">
        <button class="icon-btn" id="emojiBtn" title="ইমোজি">😀</button>
        <div id="emojiPicker"></div>
        <textarea id="textInput" placeholder="যেকোনো ভাষায় মেসেজ লেখো..." rows="1"></textarea>
        <button class="icon-btn" id="micBtn" title="ভয়েস দিয়ে লেখো (যেকোনো ভাষা)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <button id="sendBtn" title="পাঠাও">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L14 20L11 13L4 12Z" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="footnote">💬 HASIBGPT – যেকোনো ভাষায় কথা বলে। ভুল থাকতে পারে, যাচাই করে নিও।</div>
    </div>
  </div>
</div>

<script>
/* ==========================================================
   HASIBGPT – সর্বভাষী AI (বাংলা, ইংরেজি, হিন্দি, আরবি ইত্যাদি)
   ========================================================== */

// ---------- STATE ----------
let conversations = [];
let currentId = null;
let isLoading = false;
let attachedFile = null;
let imageGenMode = false;
let svgGenMode = false;
let recognizing = false;
let recognition = null;
let currentAbortController = null;

// ---------- DOM ----------
const chatListEl = document.getElementById('chatList');
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const newChatBtn = document.getElementById('newChatBtn');
const toggleSidebarBtn = document.getElementById('toggleSidebar');
const sidebar = document.getElementById('sidebar');
const attachBtn = document.getElementById('attachBtn');
const fileInput = document.getElementById('fileInput');
const attachPreview = document.getElementById('attachPreview');
const attachThumb = document.getElementById('attachThumb');
const attachName = document.getElementById('attachName');
const removeAttach = document.getElementById('removeAttach');
const imageGenToggle = document.getElementById('imageGenToggle');
const svgGenToggle = document.getElementById('svgGenToggle');
const micBtn = document.getElementById('micBtn');
const emojiBtn = document.getElementById('emojiBtn');
const emojiPicker = document.getElementById('emojiPicker');
const edgeHandle = document.getElementById('edgeHandle');
const themeBtn = document.getElementById('themeBtn');
const downloadBtn = document.getElementById('downloadBtn');
const clearBtn = document.getElementById('clearBtn');

// ---------- ইউটিলিটি ----------
function uid(){ return 'c_' + Math.random().toString(36).slice(2,10); }

// ---------- চ্যাট ম্যানেজমেন্ট ----------
function createNewChat(switchTo=true){
  const conv = { id: uid(), title: 'নতুন চ্যাট', apiHistory: [], displayMessages: [] };
  conversations.unshift(conv);
  if(switchTo) currentId = conv.id;
  resetAttachmentUI();
  renderSidebar();
  renderMessages();
}

function getCurrent(){
  return conversations.find(c => c.id === currentId);
}

function switchChat(id){
  currentId = id;
  resetAttachmentUI();
  renderSidebar();
  renderMessages();
}

function deleteChat(id, e){
  e.stopPropagation();
  conversations = conversations.filter(c => c.id !== id);
  resetAttachmentUI();
  if(currentId === id){
    if(conversations.length){ currentId = conversations[0].id; }
    else { createNewChat(); return; }
  }
  renderSidebar();
  renderMessages();
}

function renderSidebar(){
  chatListEl.innerHTML = '';
  conversations.forEach(conv => {
    const item = document.createElement('div');
    item.className = 'chat-item' + (conv.id === currentId ? ' active' : '');
    item.onclick = () => switchChat(conv.id);

    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = conv.title;

    const del = document.createElement('span');
    del.className = 'del';
    del.textContent = '✕';
    del.onclick = (e) => deleteChat(conv.id, e);

    item.appendChild(title);
    item.appendChild(del);
    chatListEl.appendChild(item);
  });
}

// ---------- মেসেজ রেন্ডার ----------
function renderMessages(){
  messagesEl.innerHTML = '';
  const conv = getCurrent();
  if(!conv || conv.displayMessages.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = `
      <div class="mark">H</div>
      <h2>যেকোনো ভাষায় কথা বলো</h2>
      <p>বাংলা, ইংরেজি, হিন্দি, আরবি, স্প্যানিশ – যা খুশি।<br>ছবি বানাও, SVG বানাও, ফাইল আপলোড করো, ভয়েস দাও।</p>
    `;
    messagesEl.appendChild(empty);
    return;
  }
  conv.displayMessages.forEach(m => renderOneMessage(m));
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function renderFormattedText(container, text){
  const fenceRegex = /```(\w*)\n?([\s\S]*?)```/g;
  let lastIndex = 0;
  let match;
  let hasCode = false;

  while((match = fenceRegex.exec(text)) !== null){
    hasCode = true;
    if(match.index > lastIndex){
      const plain = text.slice(lastIndex, match.index);
      if(plain.trim()){
        const seg = document.createElement('div');
        seg.className = 'text-segment';
        seg.textContent = plain;
        container.appendChild(seg);
      }
    }
    const lang = (match[1] || 'text').trim();
    const code = match[2].replace(/\n$/, '');
    container.appendChild(buildCodeBlock(lang, code));
    lastIndex = fenceRegex.lastIndex;
  }

  if(!hasCode){
    container.textContent = text;
    return;
  }

  if(lastIndex < text.length){
    const remaining = text.slice(lastIndex);
    if(remaining.trim()){
      const seg = document.createElement('div');
      seg.className = 'text-segment';
      seg.textContent = remaining;
      container.appendChild(seg);
    }
  }
}

function buildCodeBlock(lang, code){
  const wrap = document.createElement('div');
  wrap.className = 'code-block';

  const head = document.createElement('div');
  head.className = 'code-block-header';

  const langLabel = document.createElement('span');
  langLabel.className = 'lang';
  langLabel.textContent = lang || 'text';
  head.appendChild(langLabel);

  const copyBtn = document.createElement('button');
  copyBtn.innerHTML = '📋 কপি';
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(code).then(() => {
      copyBtn.innerHTML = '✅ কপি হয়েছে';
      setTimeout(() => copyBtn.innerHTML = '📋 কপি', 1500);
    });
  };
  head.appendChild(copyBtn);

  wrap.appendChild(head);

  const pre = document.createElement('pre');
  const codeEl = document.createElement('code');
  codeEl.textContent = code;
  pre.appendChild(codeEl);
  wrap.appendChild(pre);

  return wrap;
}

function renderOneMessage(m){
  const row = document.createElement('div');
  row.className = 'row ' + (m.role === 'user' ? 'user' : 'ai');

  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + (m.role === 'user' ? 'me' : 'ai');
  avatar.textContent = m.role === 'user' ? 'তু' : 'H';

  const col = document.createElement('div');
  col.className = 'bubble-col';

  if(m.type === 'image-attach'){
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const img = document.createElement('img');
    img.className = 'attached-thumb';
    img.src = m.imageData;
    bubble.appendChild(img);
    if(m.text){
      const p = document.createElement('div');
      p.style.marginTop = '8px';
      p.textContent = m.text;
      bubble.appendChild(p);
    }
    col.appendChild(bubble);
  } else if(m.type === 'file-attach'){
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const chip = document.createElement('div');
    chip.className = 'file-chip';
    chip.innerHTML = `<span class="file-chip-icon">📄</span><span>${m.fileName}</span>`;
    bubble.appendChild(chip);
    if(m.text){
      const p = document.createElement('div');
      p.style.marginTop = '8px';
      p.textContent = m.text;
      bubble.appendChild(p);
    }
    col.appendChild(bubble);
  } else if(m.type === 'svg-image'){
    const frame = document.createElement('div');
    frame.className = 'svg-frame';
    frame.innerHTML = m.svg;
    col.appendChild(frame);
  } else if(m.type === 'gen-image'){
    const frame = document.createElement('div');
    frame.className = 'gen-image-frame';
    const img = document.createElement('img');
    img.src = m.imageUrl;
    img.alt = m.prompt || 'generated image';
    frame.appendChild(img);
    const cap = document.createElement('div');
    cap.className = 'caption';
    cap.textContent = '🎨 ' + (m.prompt || '');
    frame.appendChild(cap);

    const downloadRow = document.createElement('div');
    downloadRow.className = 'download-row';
    const dlBtn = document.createElement('button');
    dlBtn.innerHTML = '⬇️ ডাউনলোড ছবি';
    dlBtn.onclick = () => {
      const a = document.createElement('a');
      a.href = m.imageUrl;
      a.download = (m.prompt || 'image').slice(0,30) + '.jpg';
      a.target = '_blank';
      a.click();
    };
    downloadRow.appendChild(dlBtn);

    const viewBtn = document.createElement('button');
    viewBtn.innerHTML = '🔍 বড় করে দেখো';
    viewBtn.onclick = () => window.open(m.imageUrl, '_blank');
    downloadRow.appendChild(viewBtn);

    frame.appendChild(downloadRow);
    col.appendChild(frame);
  } else {
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if(m.role === 'ai'){
      renderFormattedText(bubble, m.text);
    } else {
      bubble.textContent = m.text;
    }
    col.appendChild(bubble);
  }

  if(m.role === 'ai' && m.type !== 'svg-image' && m.type !== 'gen-image'){
    const actions = document.createElement('div');
    actions.className = 'msg-actions';

    const speakBtn = document.createElement('button');
    speakBtn.innerHTML = '🔊 শোনো';
    speakBtn.onclick = () => speakText(m.text);
    actions.appendChild(speakBtn);

    const copyBtn = document.createElement('button');
    copyBtn.innerHTML = '📋 কপি';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(m.text).then(() => {
        copyBtn.innerHTML = '✅ কপি হয়েছে';
        setTimeout(() => copyBtn.innerHTML = '📋 কপি', 1500);
      });
    };
    actions.appendChild(copyBtn);

    const conv = getCurrent();
    const isLast = conv && conv.displayMessages[conv.displayMessages.length - 1] === m;
    if(isLast){
      const regenBtn = document.createElement('button');
      regenBtn.innerHTML = '🔄 আবার লেখো';
      regenBtn.onclick = () => regenerateLast();
      actions.appendChild(regenBtn);
    }

    col.appendChild(actions);
  }

  if(m.role === 'user'){
    row.appendChild(col);
    row.appendChild(avatar);
  } else {
    row.appendChild(avatar);
    row.appendChild(col);
  }
  messagesEl.appendChild(row);
}

function addTypingIndicator(){
  const row = document.createElement('div');
  row.className = 'row ai';
  row.id = 'typingRow';
  const avatar = document.createElement('div');
  avatar.className = 'avatar ai';
  avatar.textContent = 'H';
  const bubble = document.createElement('div');
  bubble.className = 'bubble typing';
  bubble.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(avatar);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function removeTypingIndicator(){
  const row = document.getElementById('typingRow');
  if(row) row.remove();
}

// ---------- TEXT-TO-SPEECH (যেকোনো ভাষা) ----------
let cachedVoices = [];
function loadVoices(){
  cachedVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
}
if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function pickVoiceForLang(langCode){
  if(!cachedVoices.length) loadVoices();
  // প্রথমে সেই ভাষার ভয়েস খোঁজো
  let voice = cachedVoices.find(v => v.lang && v.lang.toLowerCase().startsWith(langCode.split('-')[0].toLowerCase()));
  if(!voice) voice = cachedVoices.find(v => v.default) || cachedVoices[0];
  return voice || null;
}

function speakText(text){
  if(!('speechSynthesis' in window)){
    alert('তোমার ব্রাউজার ভয়েস আউটপুট সাপোর্ট করে না। Chrome বা Edge ব্যবহার করে দেখো।');
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  // ভাষা ডিটেক্ট – প্রথম লাইনের ভাষা অনুমান
  const langHint = detectLanguage(text);
  const voice = pickVoiceForLang(langHint);
  if(voice){
    utter.voice = voice;
    utter.lang = voice.lang;
  } else {
    utter.lang = langHint; // fallback
  }
  utter.rate = 0.95;
  utter.onerror = () => console.error('Speech error');
  window.speechSynthesis.resume();
  window.speechSynthesis.speak(utter);
}

// ---------- LANGUAGE DETECTION (সরল) ----------
function detectLanguage(text){
  // বাংলা ইউনিকোড রেঞ্জ
  if(/[\u0980-\u09FF]/.test(text)) return 'bn-BD';
  // আরবি
  if(/[\u0600-\u06FF]/.test(text)) return 'ar-SA';
  // হিন্দি / দেবনাগরী
  if(/[\u0900-\u097F]/.test(text)) return 'hi-IN';
  // চীনা
  if(/[\u4e00-\u9fff]/.test(text)) return 'zh-CN';
  // স্প্যানিশ
  if(/[áéíóúñ]/i.test(text)) return 'es-ES';
  // ফরাসি
  if(/[àâçéèêëîïôûùü]/i.test(text)) return 'fr-FR';
  // ডিফল্ট ইংরেজি
  return 'en-US';
}

// ---------- SPEECH-TO-TEXT (যেকোনো ভাষা) ----------
function setupRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ return null; }
  const r = new SR();
  r.lang = 'bn-BD'; // default, but it auto-detects if we set continuous
  r.continuous = false;
  r.interimResults = false;
  r.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    inputEl.value = (inputEl.value ? inputEl.value + ' ' : '') + transcript;
    inputEl.dispatchEvent(new Event('input'));
  };
  r.onend = () => { recognizing = false; micBtn.classList.remove('recording'); };
  r.onerror = () => { recognizing = false; micBtn.classList.remove('recording'); };
  return r;
}

micBtn.addEventListener('click', () => {
  if(!recognition) recognition = setupRecognition();
  if(!recognition){
    alert('তোমার ব্রাউজার ভয়েস ইনপুট সাপোর্ট করে না। Chrome ব্যবহার করে দেখো।');
    return;
  }
  if(recognizing){
    recognition.stop();
    recognizing = false;
    micBtn.classList.remove('recording');
  } else {
    recognition.start();
    recognizing = true;
    micBtn.classList.add('recording');
  }
});

// ---------- ফাইল আপলোড ----------
attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if(!file) return;

  const isImage = file.type.startsWith('image/');
  const isPdf = file.type === 'application/pdf';
  const isText = !isImage && !isPdf;

  if(isImage){
    const reader = new FileReader();
    reader.onload = () => {
      const base64Full = reader.result;
      const base64Data = base64Full.split(',')[1];
      attachedFile = { kind:'image', mediaType: file.type, base64: base64Data, name: file.name, preview: base64Full };
      showAttachPreview(file.name, base64Full, false);
    };
    reader.onerror = () => alert('ছবিটা পড়তে সমস্যা হয়েছে, আবার চেষ্টা করো।');
    reader.readAsDataURL(file);
  } else if(isPdf){
    const reader = new FileReader();
    reader.onload = () => {
      const base64Full = reader.result;
      const base64Data = base64Full.split(',')[1];
      attachedFile = { kind:'pdf', mediaType: 'application/pdf', base64: base64Data, name: file.name };
      showAttachPreview(file.name, '', true);
    };
    reader.onerror = () => alert('PDF পড়তে সমস্যা হয়েছে, আবার চেষ্টা করো।');
    reader.readAsDataURL(file);
  } else if(isText){
    const reader = new FileReader();
    reader.onload = () => {
      attachedFile = { kind:'text', text: reader.result, name: file.name };
      showAttachPreview(file.name, '', true);
    };
    reader.onerror = () => alert('ফাইলটা পড়তে সমস্যা হয়েছে, আবার চেষ্টা করো।');
    reader.readAsText(file);
  }
});

function showAttachPreview(name, imgSrc, isGenericFile){
  attachName.textContent = name;
  if(isGenericFile){
    attachThumb.style.display = 'none';
  } else {
    attachThumb.style.display = 'block';
    attachThumb.src = imgSrc;
  }
  attachPreview.style.display = 'flex';
}

function resetAttachmentUI(){
  attachedFile = null;
  fileInput.value = '';
  attachPreview.style.display = 'none';
}
removeAttach.addEventListener('click', resetAttachmentUI);

// ---------- ইমোজি ----------
const EMOJI_LIST = [
  '😀','😁','😂','🤣','😊','😍','😘','😉','😎','🤔',
  '😅','😢','😭','😡','🥳','😴','🤗','🙏','👍','👎',
  '👏','💪','🙌','🤝','❤️','💔','🔥','⭐','✨','🎉',
  '🎂','🎁','☕','🍕','🍔','🍫','🌸','🌞','🌙','☔',
  '⚽','🏆','📚','💡','💻','📱','✈️','🚗','🏠','⏰'
];
EMOJI_LIST.forEach(emo => {
  const b = document.createElement('button');
  b.textContent = emo;
  b.onclick = () => {
    const start = inputEl.selectionStart || inputEl.value.length;
    const end = inputEl.selectionEnd || inputEl.value.length;
    inputEl.value = inputEl.value.slice(0, start) + emo + inputEl.value.slice(end);
    inputEl.focus();
    inputEl.selectionStart = inputEl.selectionEnd = start + emo.length;
    inputEl.dispatchEvent(new Event('input'));
  };
  emojiPicker.appendChild(b);
});
emojiBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  emojiPicker.classList.toggle('show');
});
document.addEventListener('click', (e) => {
  if(emojiPicker.classList.contains('show') && !emojiPicker.contains(e.target) && e.target !== emojiBtn){
    emojiPicker.classList.remove('show');
  }
});

// ---------- মোড টগল ----------
imageGenToggle.addEventListener('click', () => {
  imageGenMode = !imageGenMode;
  svgGenMode = false;
  svgGenToggle.classList.remove('active');
  imageGenToggle.classList.toggle('active', imageGenMode);
  inputEl.placeholder = imageGenMode ? 'কী ছবি বানাতে চাও? (যেকোনো ভাষায়)' : 'যেকোনো ভাষায় মেসেজ লেখো...';
});

svgGenToggle.addEventListener('click', () => {
  svgGenMode = !svgGenMode;
  imageGenMode = false;
  imageGenToggle.classList.remove('active');
  svgGenToggle.classList.toggle('active', svgGenMode);
  inputEl.placeholder = svgGenMode ? 'কী SVG বানাতে চাও? (যেকোনো ভাষায়)' : 'যেকোনো ভাষায় মেসেজ লেখো...';
});

// ---------- ইনপুট ----------
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
});
inputEl.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
sendBtn.addEventListener('click', () => {
  if(isLoading && currentAbortController){
    currentAbortController.abort();
    return;
  }
  sendMessage();
});
newChatBtn.addEventListener('click', () => createNewChat());

// ---------- সাইডবার ----------
function setSidebar(collapsed){
  if(window.innerWidth <= 720){
    sidebar.classList.toggle('collapsed', collapsed);
    edgeHandle.classList.toggle('show', collapsed);
  }
}
toggleSidebarBtn.addEventListener('click', () => setSidebar(!sidebar.classList.contains('collapsed')));
edgeHandle.addEventListener('click', () => setSidebar(false));

let touchStartX = null;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
}, { passive:true });
document.addEventListener('touchend', (e) => {
  if(touchStartX === null) return;
  const touchEndX = e.changedTouches[0].clientX;
  const dx = touchEndX - touchStartX;
  const collapsed = sidebar.classList.contains('collapsed');
  if(collapsed && touchStartX < 40 && dx > 60){
    setSidebar(false);
  } else if(!collapsed && dx < -60){
    setSidebar(true);
  }
  touchStartX = null;
});

// ---------- থিম ----------
themeBtn.addEventListener('click', () => {
  const isDark = document.body.getAttribute('data-theme') === 'dark';
  document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
});

// ---------- ডাউনলোড ----------
downloadBtn.addEventListener('click', () => {
  const conv = getCurrent();
  if(!conv || conv.displayMessages.length === 0){
    alert('এই চ্যাটে কিছু নেই ডাউনলোড করার মতো।');
    return;
  }
  let text = `HASIBGPT চ্যাট — ${conv.title}\n\n`;
  conv.displayMessages.forEach(m => {
    const who = m.role === 'user' ? 'তুমি' : 'HASIBGPT';
    const content = m.type === 'gen-image' ? `[ছবি: "${m.prompt}"]` : (m.type === 'svg-image' ? '[SVG]' : (m.text || '[ফাইল]'));
    text += `${who}: ${content}\n\n`;
  });
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (conv.title || 'chat') + '.txt';
  a.click();
  URL.revokeObjectURL(url);
});

// ---------- ক্লিয়ার ----------
clearBtn.addEventListener('click', () => {
  const conv = getCurrent();
  if(!conv) return;
  if(conv.displayMessages.length === 0) return;
  if(confirm('এই চ্যাটের সব মেসেজ মুছে ফেলতে চাও?')){
    conv.displayMessages = [];
    conv.apiHistory = [];
    conv.title = 'নতুন চ্যাট';
    renderSidebar();
    renderMessages();
  }
});

// ---------- রিজেনারেট ----------
async function regenerateLast(){
  const conv = getCurrent();
  if(!conv || isLoading) return;
  const lastDisplay = conv.displayMessages[conv.displayMessages.length - 1];
  if(!lastDisplay || lastDisplay.role !== 'ai') return;
  conv.displayMessages.pop();
  if(conv.apiHistory.length && conv.apiHistory[conv.apiHistory.length - 1].role === 'assistant'){
    conv.apiHistory.pop();
  }
  renderMessages();
  isLoading = true;
  setSendButtonState(true);
  addTypingIndicator();
  currentAbortController = new AbortController();
  try{
    const replyText = await callClaude(conv.apiHistory, currentAbortController.signal);
    removeTypingIndicator();
    const finalText = replyText || 'দুঃখিত, উত্তর তৈরি করতে সমস্যা হয়েছে।';
    conv.displayMessages.push({ role:'ai', type:'text', text: finalText });
    conv.apiHistory.push({ role:'assistant', content: finalText });
  }catch(err){
    removeTypingIndicator();
    if(err.name !== 'AbortError'){
      conv.displayMessages.push({ role:'ai', type:'text', text: 'কিছু একটা সমস্যা হয়েছে, আবার চেষ্টা করো।' });
    }
  }
  renderMessages();
  isLoading = false;
  setSendButtonState(false);
  currentAbortController = null;
}

// ---------- কল ক্লড (সর্বভাষী নির্দেশ) ----------
async function callClaude(messages, signal){
  // সর্বশেষ ইউজার মেসেজের ভাষা ডিটেক্ট করে সিস্টেম প্রম্পটে জানাই
  let userLang = 'bn-BD';
  for(let i=messages.length-1; i>=0; i--){
    if(messages[i].role === 'user'){
      if(typeof messages[i].content === 'string'){
        userLang = detectLanguage(messages[i].content);
      } else if(Array.isArray(messages[i].content)){
        const textPart = messages[i].content.find(c => c.type === 'text');
        if(textPart) userLang = detectLanguage(textPart.text);
      }
      break;
    }
  }

  const sysPrompt = `You are HASIBGPT, a multilingual AI. Reply in the SAME language as the user's last message. Detect the language and respond naturally. If the user writes in Bengali, answer in Bengali. If English, answer in English. If Hindi, answer in Hindi. If Arabic, answer in Arabic. Always be helpful and concise.`;
  const fullMessages = [{ role: 'system', content: sysPrompt }, ...messages];

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    signal: signal,
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1200,
      messages: fullMessages
    })
  });
  const data = await response.json();
  let replyText = "";
  if(data && data.content){
    replyText = data.content.map(b => b.type === 'text' ? b.text : '').filter(Boolean).join('\n');
  }
  return replyText;
}

// ---------- সেন্ড মেসেজ ----------
const SEND_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L14 20L11 13L4 12Z" fill="currentColor"/></svg>';
const STOP_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>';
function setSendButtonState(loading){
  sendBtn.classList.toggle('stop-mode', loading);
  sendBtn.innerHTML = loading ? STOP_ICON : SEND_ICON;
  sendBtn.title = loading ? 'থামাও' : 'পাঠাও';
}

async function sendMessage(){
  const text = inputEl.value.trim();
  if((!text && !attachedFile) || isLoading) return;
  if(!currentId) createNewChat(false);
  const conv = getCurrent();

  // ---- SVG ----
  if(svgGenMode && text){
    conv.displayMessages.push({ role:'user', type:'text', text: '📐 ' + text });
    if(conv.title === 'নতুন চ্যাট') conv.title = '📐 ' + text.slice(0,28);
    renderSidebar();
    renderMessages();
    inputEl.value = ''; inputEl.style.height = 'auto';
    addTypingIndicator();
    setSendButtonState(true);
    isLoading = true;
    currentAbortController = new AbortController();

    try{
      const lang = detectLanguage(text);
      const svgPrompt = `You are a skilled SVG designer. Create a clean, minimal SVG based on the description below. Return ONLY valid SVG code, no other text.\n\nDescription: ${text}\n\nLanguage: ${lang}`;
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        signal: currentAbortController.signal,
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1800,
          messages: [ { role: 'user', content: svgPrompt } ]
        })
      });
      const data = await response.json();
      let svgCode = '';
      if(data.content){
        svgCode = data.content.map(b => b.type === 'text' ? b.text : '').join('');
      }
      const svgMatch = svgCode.match(/<svg[^>]*>[\s\S]*?<\/svg>/i);
      const finalSvg = svgMatch ? svgMatch[0] : '<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg"><text x="10" y="100" font-family="sans-serif" font-size="16">SVG তৈরি করতে সমস্যা হয়েছে</text></svg>';
      removeTypingIndicator();
      conv.displayMessages.push({ role:'ai', type:'svg-image', svg: finalSvg });
      conv.apiHistory.push({ role:'assistant', content: 'SVG তৈরি করা হয়েছে।' });
    }catch(err){
      removeTypingIndicator();
      if(err.name !== 'AbortError'){
        conv.displayMessages.push({ role:'ai', type:'text', text: 'SVG তৈরি করতে সমস্যা হয়েছে, আবার চেষ্টা করো।' });
      }
    }
    renderMessages();
    isLoading = false;
    setSendButtonState(false);
    currentAbortController = null;
    inputEl.focus();
    return;
  }

  // ---- ইমেজ জেনারেশন (Pollinations) ----
  if(imageGenMode && text){
    conv.displayMessages.push({ role:'user', type:'text', text: '🎨 ' + text });
    if(conv.title === 'নতুন চ্যাট') conv.title = '🎨 ' + text.slice(0,28);
    renderSidebar();
    renderMessages();
    inputEl.value = ''; inputEl.style.height = 'auto';
    addTypingIndicator();
    setSendButtonState(true);
    isLoading = true;

    const seed = Math.floor(Math.random() * 1000000);
    const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?width=768&height=768&nologo=true&seed=${seed}`;

    const preload = new Image();
    preload.onload = () => {
      removeTypingIndicator();
      conv.displayMessages.push({ role:'ai', type:'gen-image', imageUrl: imageUrl, prompt: text });
      renderMessages();
      isLoading = false;
      setSendButtonState(false);
      sendBtn.disabled = false;
      inputEl.focus();
    };
    preload.onerror = () => {
      removeTypingIndicator();
      conv.displayMessages.push({ role:'ai', type:'text', text: 'ছবি তৈরি করতে সমস্যা হয়েছে (হয়তো একটু বেশি রিকোয়েস্ট চলে গেছে — কয়েক সেকেন্ড পর আবার চেষ্টা করো)।' });
      renderMessages();
      isLoading = false;
      setSendButtonState(false);
      sendBtn.disabled = false;
      inputEl.focus();
    };
    preload.src = imageUrl;
    return;
  }

  // ---- নরমাল টেক্সট / ফাইল ----
  let apiContent;
  if(attachedFile && attachedFile.kind === 'image'){
    apiContent = [
      { type:'image', source:{ type:'base64', media_type: attachedFile.mediaType, data: attachedFile.base64 } },
      { type:'text', text: text || 'এই ছবিতে কী আছে বলো।' }
    ];
    conv.displayMessages.push({ role:'user', type:'image-attach', imageData: attachedFile.preview, text: text });
  } else if(attachedFile && attachedFile.kind === 'pdf'){
    apiContent = [
      { type:'document', source:{ type:'base64', media_type:'application/pdf', data: attachedFile.base64 } },
      { type:'text', text: text || 'এই ফাইলে কী আছে বলো।' }
    ];
    conv.displayMessages.push({ role:'user', type:'file-attach', fileName: attachedFile.name, text: text });
  } else if(attachedFile && attachedFile.kind === 'text'){
    const combined = `${text ? text + '\n\n' : ''}[সংযুক্ত ফাইল: ${attachedFile.name}]\n\`\`\`\n${attachedFile.text}\n\`\`\``;
    apiContent = combined;
    conv.displayMessages.push({ role:'user', type:'file-attach', fileName: attachedFile.name, text: text });
  } else {
    apiContent = text;
    conv.displayMessages.push({ role:'user', type:'text', text: text });
  }

  if(conv.title === 'নতুন চ্যাট') conv.title = (text || (attachedFile ? attachedFile.name : 'ফাইল পাঠানো হয়েছে')).slice(0,28);

  conv.apiHistory.push({ role:'user', content: apiContent });

  resetAttachmentUI();
  inputEl.value = '';
  inputEl.style.height = 'auto';

  renderSidebar();
  renderMessages();
  addTypingIndicator();
  setSendButtonState(true);
  currentAbortController = new AbortController();

  try{
    const replyText = await callClaude(conv.apiHistory, currentAbortController.signal);
    removeTypingIndicator();
    const finalText = replyText || 'দুঃখিত, উত্তর তৈরি করতে সমস্যা হয়েছে। আবার চেষ্টা করো।';
    conv.displayMessages.push({ role:'ai', type:'text', text: finalText });
    conv.apiHistory.push({ role:'assistant', content: finalText });
  }catch(err){
    removeTypingIndicator();
    if(err.name !== 'AbortError'){
      conv.displayMessages.push({ role:'ai', type:'text', text: 'কিছু একটা সমস্যা হয়েছে, আবার চেষ্টা করো।' });
    }
    console.error(err);
  }

  renderMessages();
  isLoading = false;
  setSendButtonState(false);
  sendBtn.disabled = false;
  currentAbortController = null;
  inputEl.focus();
}

// ---------- বুট ----------
createNewChat();

// ডেস্কটপে সাইডবার খোলা থাকবে
if(window.innerWidth > 720) {
  sidebar.classList.remove('collapsed');
  edgeHandle.classList.remove('show');
} else {
  sidebar.classList.add('collapsed');
  edgeHandle.classList.add('show');
}
</script>
